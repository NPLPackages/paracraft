<script refresh="true" type="text/npl" src="MyProjectList.lua" ><![CDATA[
    local MyProjectList = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Project/MyProjectList.lua")
    MyProjectList.OnInit(true)

    local page = document:GetPageCtrl()

    local temp_modify_worldname = ""
    function OnclickCreate()
        MyProjectList.OnCreateProject()
    end

    function GetMenuData()
        return MyProjectList.GetMenuData()
    end

    function GetCategoryDSIndex()
        return MyProjectList.GetCategoryDSIndex()
    end

    function OnChangeProjectTabview(name)
        local index = tonumber(name)
        if index then
            print("OnChangeProjectTabview-----------------", index)
            MyProjectList.ChangeMenuTab(index)
        end
    end

    function GetSortData()
        return MyProjectList.GetSortData()
    end


    function IsSortSelected(index)
        return MyProjectList.IsSortSelected(index)
    end

    function OnChangeSort(name)
        local index = tonumber(name)
        if index then
            MyProjectList.OnSortProject(index)
        end
    end

    function GetSortType()
        return MyProjectList.GetSortType()
    end

    function GridsItems(index)
        if index == nil then
            return #MyProjectList.pageList
        else
            return MyProjectList.pageList[index]
        end
    end

    function IsProjectSelected(index)
        return MyProjectList.IsProjectSelected(index)
    end

    function get_world_preview()
        local status = Eval('status')
        local empty_preview = 'Texture/Aries/Creator/paracraft/konbaitu_266x134_x2_32bits.png# 0 0 532 268'
        if is_select_recyclable() then
            local project = Eval('project')

            if not project or
                type(project) ~= 'table' or
                not project.extra or
                type(project.extra) ~= 'table' or
                not project.extra.imageUrl or
                type(project.extra.imageUrl) ~= 'string' or
                project.extra.imageUrl == '' then
                return empty_preview
            end

            return project.extra.imageUrl
        end
        if tonumber(status) == 2 then
            local project = Eval('project')

            if not project or
                type(project) ~= 'table' or
                not project.extra or
                type(project.extra) ~= 'table' or
                not project.extra.imageUrl or
                type(project.extra.imageUrl) ~= 'string' or
                project.extra.imageUrl == '' then
                return empty_preview
            end

            return project.extra.imageUrl
        else
            local worldpath = Eval('worldpath')

            if not worldpath or type(worldpath) ~= 'string' then
                return empty_preview
            end

            local preview = worldpath .. 'preview.jpg'

            if ParaIO.DoesFileExist(preview) then
                return preview
            else
                return empty_preview
            end
        end
    end

    function is_select_recyclable()
        return MyProjectList.IsSelectRecycle()
    end

    function has_world_status()
        if is_select_recyclable() then
            return false
        end
        local status = MyProjectList.GetCurWorldInfo('status', Eval('index'))
        if status then
            return true
        else
            return false
        end
    end

    function get_world_status_icon()
        local status = MyProjectList.GetCurWorldInfo('status', Eval('index'))
    
        if status == 1 then
            return 'background:url(Texture/Aries/Creator/keepwork/community_32bits.png#434 118 8 8)';
        end

        if status == 2 then
            return 'background:url(Texture/Aries/Creator/keepwork/community_32bits.png#446 106 8 8)';
        end

        if status == 3 then
            return 'background:url(Texture/Aries/Creator/keepwork/community_32bits.png#446 118 8 8)';
        end

        if status == 4 then
            return 'background:url(Texture/Aries/Creator/keepwork/community_32bits.png#458 106 8 8)';
        end

        if status == 5 then
            return 'background:url(Texture/Aries/Creator/keepwork/community_32bits.png#458 118 8 8)';
        end
    end

    function get_world_status_tips()
        return FormatStatus(MyProjectList.GetCurWorldInfo('status', Eval('index')));
    end

    function FormatStatus(status)
        if status == 1 then
            return L'仅本地'
        elseif status == 2 then
            return L'仅网络'
        elseif status == 3 then
            return L'本地版本与远程数据源一致'
        elseif status == 4 then
            return L'本地版本更加新'
        elseif status == 5 then
            return L'远程版本更加新'
        else
            return L'获取状态中'
        end
    end

    function is_modifying()
        return MyProjectList.is_modify_world_name
    end

    function switch_world(index)
        MyProjectList.is_modify_world_name = false
        MyProjectList.OnSwitchWorld(index)
    end

    function covert_status(index)
        local index = tonumber(index)
        if not index or index == 0 then
            return
        end
        MyProjectList.OnSwitchWorld(index)
        
        
        local currentWorld = Mod.WorldShare.Store:Get('world/currentWorld')
        local currentEnterWorld = Mod.WorldShare.Store:Get('world/currentEnterWorld')
        if currentEnterWorld and
            currentEnterWorld.foldername == currentWorld.foldername then
            GameLogic.AddBBS(nil, L'不能重命名当前编辑的世界', 3000, '255 0 0')
            return
        end
        if MyProjectList.is_modify_world_name then
            -- 客户端处理铭感词
            local temp = MyCompany.Aries.Chat.BadWordFilter.FilterString2(temp_modify_worldname);
            if temp~=temp_modify_worldname then 
                _guihelper.MessageBox(L"该世界名称不可用，请重新设定");
                return
            end

            local count = ParaMisc.GetUnicodeCharNum(temp_modify_worldname);
            if count > 66 then
                _guihelper.MessageBox(format(L'世界名字超过%d个字符, 请重新输入', 66))
                return
            end

            -- update world name
            if MyProjectList.WorldRename(
                index,
                temp_modify_worldname,
                function()
                    MyProjectList.GetProjectList(MyProjectList.statusFilter, function()
                        switch_world(index)
                    end)
                end
            ) then
                temp_modify_worldname = ''
            else
                temp_modify_worldname = ''
                MyProjectList.is_modify_world_name = not MyProjectList.is_modify_world_name
                page:Refresh(0.1)
            end
            return
        end
        MyProjectList.is_modify_world_name = not MyProjectList.is_modify_world_name
        page:Refresh(0.1)
    end

    function get_tagname()
        if Eval('name') and Eval('name') ~= '' then
            return Eval('name')
        end
    end

    function get_world_text()
        if not Eval('text') or type(Eval('text')) ~= 'string' then
            return ''
        end
        local text = Eval('text')
        local pid = ""
        if Eval("hasPid") then
            pid = " #"..Eval("kpProjectId")
        end
        text = MyCompany.Aries.Chat.BadWordFilter.FilterString(text)
        text = text or ""
        local max_len = 334
        if is_select_recyclable() then
            max_len = 150
        end
        text = commonlib.GetLimitLabelByTextWidth(text,max_len,"System;12;norm")

        if Eval('is_zip') == true then
            text = text .. '.zip'
        end
        text = text.. pid
        return text
    end

    function is_show_modify_button()
        if is_select_recyclable() then
            return false
        end
        local is_shared = MyProjectList.GetCurWorldInfo('shared', Eval('index'))

        if is_shared then
            local username = Mod.WorldShare.Store:Get('user/username')
            local user = MyProjectList.GetCurWorldInfo('user', Eval('index'))

            if not user or
                type(user) ~= 'table' or
                not user.username then
                return false
            end

            if username == user.username then
                return true
            else
                return false
            end
        else
            return true
        end
    end

    function get_world_date()
        local datetime = MyProjectList.GetCurWorldInfo('modifyTime', Eval('index'))
        datetime = Mod.WorldShare.Utils:RecentDatetimeFormat(datetime)
        return datetime
    end

    function lazy_load()
        MyProjectList.curPage = MyProjectList.curPage + 1

        MyProjectList:GetPageList()
    end

    function is_load_more_items(index)
        if not MyProjectList.currentWorldList or
            type(MyProjectList.currentWorldList) ~= 'table' then
            return false
        end

        if index >= #MyProjectList.currentWorldList then
            return false
        end

        if index == #MyProjectList.pageList then
            return true
        end
    end

    function get_project_views()
        local project = Eval('project')

        if not project or type(project) ~= 'table' then
            return 0
        end

        if project.visit and type(project.visit) == 'number' then
            return project.visit
        else
            return 0
        end
    end

    function get_project_thumbs()
        local project = Eval('project')

        if not project or type(project) ~= 'table' then
            return 0
        end

        if project.star and type(project.star) == 'number' then
            return project.star
        else
            return 0
        end
    end

    function get_project_comments()
        local project = Eval('comment')

        if not project or type(project) ~= 'table' then
            return 0
        end

        if project.comment and type(project.comment) == 'number' then
            return project.comment
        else
            return 0
        end
    end

    function get_project_collect()
        local project = Eval('project')

        if not project or type(project) ~= 'table' then
            return 0
        end

        if project.favorite and type(project.favorite) == 'number' then
            return project.favorite
        else
            return 0
        end
    end

    function has_project_id()
        local currentSelectedWorld = MyProjectList.GetSelectWorld(Eval('index'))

        if currentSelectedWorld and
            type(currentSelectedWorld) == 'table' and
            currentSelectedWorld.kpProjectId and
            type(currentSelectedWorld.kpProjectId) == 'number' and
            currentSelectedWorld.kpProjectId ~= 0 then
            return true
        else
            return false
        end
    end

    function OnProjectNameFocusOut(name, mcmlNode)
        local index = tonumber(name)
        if index and MyProjectList.is_modify_world_name then
            covert_status(index)
            GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_my_frame.click_change_name", {useNoId=true},nil,true);
        end
    end

    function OnProjectNameKeyUp(name, mcmlNode)
        if(virtual_key == Event_Mapping.EM_KEY_RETURN or virtual_key == Event_Mapping.EM_KEY_NUMPADENTER) then
            OnProjectNameFocusOut(name, mcmlNode)
        end
    end

    function OnMouseEnterProjectName(name, mcmlNode)
        local index = tonumber(name)
        if index then
            MyProjectList.OnMouseEnterImp(index,true)
        end
    end

    function OnMouseLeaveProjectName(name, mcmlNode)
        local index = tonumber(name)
        if index then
            MyProjectList.OnMouseLeaveImp(index,true)
        end
    end

    function OnProjectNameFocusIn(name, mcmlNode)
        local index = tonumber(name)
        if index then
            MyProjectList.OnMouseEnterImp(index,true)
        end
    end
    

    function OnclickConfirmModify(name,mcmlNode)
        OnProjectNameFocusOut(name, mcmlNode)
    end

    function update_temp_modify_worldname(name, mcmlNode)
        temp_modify_worldname = mcmlNode:GetUIValue()
    end

    function be_selected()
        return IsProjectSelected(Eval('index'))
    end

    function OnclickSelectWorld(name, mcmlNode)
        local index = tonumber(name)
        if index then
            switch_world(index)
            page:Refresh(0.1)
        end
    end

    function share(name)
        local index = tonumber(name)
        if index then
            switch_world(index)
            local currentWorld = Mod.WorldShare.Store:Get('world/currentWorld')
            if not currentWorld or type(currentWorld) ~= 'table' then
                return
            end
            if not currentWorld.hasPid then
                GameLogic.AddBBS(nil, L'请先上传当前世界', 3000, '255 0 0')
            end
            if  not currentWorld.project or currentWorld.project.visibility == 1 then
                GameLogic.AddBBS(nil, L'不能分享当前世界', 3000, '255 0 0')
                return
            end
            GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_my_frame.click_share", {useNoId=true},nil,true);      
            if currentWorld and
                type(currentWorld) == 'table' and
                currentWorld.kpProjectId and
                type(currentWorld.kpProjectId) == 'number' and
                currentWorld.kpProjectId ~= 0 then
                local WorldSharePage = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/ShareWorld/WorldSharePage.lua") 
                WorldSharePage.ShowView(currentWorld)
            end
        end
    end

    function sync(name)
        local index = tonumber(name)
        if not index then
            return
        end
        switch_world(index)
        MyProjectList.OnSyncProject(index)
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_my_frame.click_sync", {useNoId=true},nil,true);
    end

    function enter(name)
        local index = tonumber(name)
        if not index or is_select_recyclable() then
            return
        end
        switch_world(index)
        MyProjectList.OnOpenProject(index)
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_my_frame.click_enter", {useNoId=true},nil,true);
    end

    function OnclickShowExtra(name)
        local index = tonumber(name)
        if not index then
            return
        end
        switch_world(index)
        MyProjectList.ShowExtraPanel()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_my_frame.click_extra", {useNoId=true},nil,true);
    end

    function OnMouseEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnBgMouseEnter(index)
    end

    function OnMouseLeave(name)
        --print("OnMouseLeave==============", name)
        local index = tonumber(name)
        if not index or not page then
            --return
        end
        MyProjectList.OnBgMouseLeave(index)
    end

    function OnMousePreviewEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnPreviewMouseEnter(index)
    end

    function OnMousePreviewLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnPreviewMouseLeave(index)
    end

    
    function OnMouseSyncEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnSyncMouseEnter(index)
    end

    function OnMouseSyncLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnSyncMouseLeave(index)
    end

    function OnMouseShareEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnShareMouseEnter(index)
    end

    function OnMouseShareLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnShareMouseLeave(index)
    end

    function OnMouseMoreEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnMoreMouseEnter(index)
    end

    function OnMouseMoreLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        MyProjectList.OnMoreMouseLeave(index)
    end

    function GetCurCategoryName()
        local menuData = GetMenuData()
        local curIndex = GetCategoryDSIndex()
        if curIndex and curIndex > 0 and curIndex <= #menuData then
            return menuData[curIndex].value
        end
        return ""
    end

    function OnClickShowCategory()
        MyProjectList.OnShowCategory()
    end
]]></script>

                            <!-- 圆角遮挡 -->
                            <pe:container ClickThrough="true" visible="true" name='<%="project_preview_border_normal_bg"..Eval("index")%>' zorder="2" style='position: relative;   width: 279px; height: 142px;background-color: #807EF4; background: url(Texture/Aries/Creator/keepwork/corner/corner10_32x32_32bit.png#0 0 32 32:14 14 14 14);'></pe:container>
                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_border_select_bg"..Eval("index")%>' zorder="2" style='position: relative;  width: 279px; height: 142px;background-color: #807EF4; background: url(Texture/Aries/Creator/keepwork/corner/corner10_32x32_32bit.png#0 0 32 32:14 14 14 14);'></pe:container>

                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_select1_bg"..Eval("index")%>' zorder="1" style='position: relative; margin-left: -1px; margin-top: -1px; width: 279px; height: 142px;background-color: #0000007F; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);'>
                                <div align="center" style="margin-top: 54px; width: 76px; height: 34px;  background: url(Texture/Aries/Creator/keepwork/Community/community_userinfo.png#4 438 32 32:15 15 15 15);">
                                    <div style="float: left; margin-left: 12px; font-size: 14px; base-font-size: 14px; font-weight: bold; color: #ffffff; text-shadow:true;shadow-quality:8;shadow-color:#60565677; margin-top: 6px;"><%=L"进入"%></div>
                                    <div style="float: left; margin-left: 4px; margin-top: 10px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/Community/community_userinfo.png#1000 84 20 18); "></div>
                                </div>
                            </pe:container>
                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_select2_bg"..Eval("index")%>' zorder="1" style='position: relative; margin-left: -1px; margin-top: -1px; width: 279px; height: 142px;background-color: #0000008F; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);'>
                                <div align="center" style="margin-top: 54px; width: 76px; height: 34px;  background: url(Texture/Aries/Creator/keepwork/Community/community_userinfo.png#4 438 32 32:15 15 15 15);">
                                    <div style="float: left; margin-left: 12px; font-size: 14px; base-font-size: 14px; font-weight: bold; color: #ffffff; text-shadow:true;shadow-quality:8;shadow-color:#60565677; margin-top: 6px;"><%=L"进入"%></div>
                                    <div style="float: left; margin-left: 4px; margin-top: 10px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/Community/community_userinfo.png#1000 84 20 18); "></div>
                                </div>
                            </pe:container>
                        </div>

                        <pe:container ClickThrough="true" zorder="2" name='<%="project_info_bg"..Eval("index")%>' style="position: relative; width: 280px; height: 30px; margin-left: 12px; margin-top: 124px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#268 6 32 32:14 14 14 14);">
                            <div style='font-size: 12px;base-font-size: 12px;color: #ffffff; margin-top: 4px; margin-left: 8px;'>
                                <div style='float:left;'>
                                    <img src='Texture/Aries/Creator/keepwork/community_32bits.png#294 103 16 11' style='width: 16px;height: 11px;margin-top: 6px;' />
                                    <div style='float:left;margin-left: 2px; margin-top: 2px;'><%= get_project_views() %></div>
                                </div>
                                <div style='float: left;margin-left: 16px;'>
                                    <img src='Texture/Aries/Creator/keepwork/community_32bits.png#341 102 16 16'style='margin-top:3px; width: 16px;height: 16px;' />
                                    <div style='float:left;margin-left: 2px; margin-top: 2px;'><%= get_project_thumbs() %></div>
                                </div>
                                <div style='float:left;margin-left: 16px;'>
                                    <img src='Texture/Aries/Creator/keepwork/community_32bits.png#318 102 16 16' style='width: 16px;height: 16px;margin-top: 3px;' />
                                    <div style='float: left;margin-left: 2px; margin-top: 2px;'><%= get_project_collect() %></div>
                                </div>
                            </div>
                        </pe:container>

                        <div style="width: 280px; height: 100px;  margin-left: 14px; margin-top: 162px;">
                            <!-- 显示项目内容 -->
                            <div style='width: 280px; height: 40px;'>
                                <!-- 显示项目状态 -->
                                <pe:if condition='<%= has_world_status() %>'>
                                    <div style='float: left; width: 8px;height: 8px;'>
                                        <div class='status' style='<%= get_world_status_icon() %>' tooltip='<%= get_world_status_tips()%>' />
                                    </div>
                                </pe:if>
                                <pe:if condition='<%= has_world_status()%>'>
                                    <div style="float: left; width: 236px; margin-left: 6px; height: 40px; font-size: 14px; base-font-size: 14px; text-align: left; color: #ffffff; margin-top: -2px;">
                                        <%= get_world_text() %>
                                    </div>
                                </pe:if>
                                <pe:if condition='<%=not has_world_status()%>'>
                                    <div style="float: left; width: 250px; height: 40px;  font-size: 14px; base-font-size: 14px; text-align: left; color: #ffffff; margin-top: 2px;">
                                        <%= get_world_text() %>
                                    </div>
                                </pe:if>
                            </div>

                            <div style="width: 254px; height: 20px; margin-top: 2px;">
                                <!-- 更新时间 -->
                                <div style='float: left; margin-top: 2px; height: 20px; width: 200px; font-size: 12px;base-font-size: 12px;color: #ffffff;'>
                                    <%= get_world_date().."  v"..(Eval("revision") or 0) %>
                                </div>
                            </div>

                            <div style="width: 160px; height: 32px; margin-top: -14px; margin-left: 120px;">
                                <pe:if condition="<%=not is_select_recyclable()%>">
                                    <input type='button' name='<%= Eval("index") %>' onmouseenter="OnMouseSyncEnter" onmouseleave="OnMouseSyncLeave"  onclick='sync'  value=""  tooltip="<%=L'同步'%>" uiname='<%="CreateEmbed.sync" .. Eval("index")%>' style='float: left;  margin-left: 42px; width: 20px;height: 20px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#216 54 20 20);' />
                                    <input type='button' name='<%= Eval("index") %>' onmouseenter="OnMouseShareEnter" onmouseleave="OnMouseShareLeave"  onclick='share' value="" tooltip="<%=L'分享'%>" uiname='<%="CreateEmbed.share" .. Eval("index")%>'style='float: left;  margin-left: 24px; margin-top:-2px;  width: 20px;height: 20px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#216 99 20 20);' />
                                </pe:if>
                                <pe:if condition="<%=is_select_recyclable()%>">
                                    <div style="float: left; margin-left: 60px; width: 70px; height: 20px;"></div>
                                </pe:if>
                               <input type='button' name='<%= Eval("index") %>' onmouseenter="OnMouseMoreEnter" onmouseleave="OnMouseMoreLeave"  onclick='OnclickShowExtra' value="" tooltip="<%=L'其他'%>" uiname='<%="CreateEmbed.more" .. Eval("index")%>' style='float: left;  margin-left: 24px; width: 20px;height: 20px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#242 100 20 20);'/>
                            </div>
                        </div>
                        <pe:if condition='<%= is_load_more_items(Eval("index")) %>'>
                            <pe:custom oncreate='<%= lazy_load %>'></pe:custom>
                        </pe:if>
                    </div>
                </Columns>
                <EmptyDataTemplate>
                    <div style='font-weight: bold;'>
                        <div align='center'style='width: 160px;height: 128px; margin-top: 160px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#2 2 160 128)'>
                        </div>
                        <div style="text-align: center; font-size: 14px; base-font-size: 14px; margin-top: -10px; color: #A8A7B0;" ><%=L"你还没有创建3D世界"%></div>
                    </div>
                </EmptyDataTemplate>
            </pe:gridview>

        </div>
        
    </div>
</pe:container>
</pe:mcml>
</body>
</html>
