<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<pe:mcml>
<script type="text/npl" src="SelectColor.lua" refresh="true">
<![CDATA[
SelectColor = commonlib.gettable("MyCompany.Aries.Game.Tasks.SelectColor");
function dummy()
end
]]>
</script>
<pe:container zorder="-1" onclick="dummy()" style="background-color:#000000;width:512px;">
    <div style="width:512px;height:56px;background:;">
        <input type="button" name="CloseBtn" onclick="SelectColor.OnClose" align="right" style="position:relative;width:56px;height:56px;background:url(Texture/player/close.png)" />
        <div style="font-size:16px;margin-top:15px;margin:10px;color:#ffffff"><%=L"选择颜色"%></div>
    </div>
    <hr/>
    <pe:gridview style="height:102px;" name="gvwSelectColorTable" DefaultNodeHeight="48" pagesize="20" ItemsPerLine="10"
                DataSource='<%=SelectColor.GetColorList()%>'>
        <Columns>
            <div name='<%=Eval("index")%>' style='<%=string.format("color:#ffffff;margin-left:5px;margin-top:5px;width:43px;height:43px;background-color:%s", Eval("color"))%>' onclick="SelectColor.OnClickColorAndClose"></div>
        </Columns>
    </pe:gridview>
</pe:container>

</pe:mcml>
</html>
