<script type="text/npl" src="EasyModel.lua" refresh="true">
<![CDATA[
EasyModel = commonlib.gettable("MyCompany.Aries.Game.Tasks.EasyModel");
EasyModel.InitQuickSelectBarPage(Page);
function OnClickDummy() 
end
function GetSlotStyle(slotIndex)
    local isSelected = EasyModel.quickSelectBarSelectedSlot == slotIndex;
    if isSelected then
        return "float:left;margin-right:5px;padding:2px;background:url(Texture/Aries/Creator/Theme/GameCommonIcon_32bits.png#74 45 40 40:12 12 12 12)";
    else
        return "float:left;margin-right:5px;padding:2px;background:url(Texture/Aries/Creator/Theme/GameCommonIcon_32bits.png#32 45 38 38:12 12 12 12)";
    end
end
function GetSlotBlockId(slotIndex)
    local itemStack = EasyModel.quickSelectBarSlots[slotIndex];
    if itemStack then
        return itemStack.id;
    end
    return 0;
end
]]>
</script>
