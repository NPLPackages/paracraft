<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Learning Quiz Dialog</title>
</head>
<body>
<pe:mcml>
<script type="text/npl"><![CDATA[
NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/EasyBuilder/Copilot/LearningToolUI.lua");
local LearningToolUI = commonlib.gettable("MyCompany.Aries.Game.Tasks.EasyBuilder.Copilot.LearningToolUI");

local page = document:GetPageCtrl();

function GetParams()
    return LearningToolUI.GetParams();
end

function GetQuestion()
    local params = GetParams();
    return params.question or "问题";
end

function GetOptions()
    local params = GetParams();
    return params.options or {};
end

function GetOptionCount()
    return #GetOptions();
end

function GetOption(index)
    local options = GetOptions();
    return options[index] or "";
end

function GetFeedback()
    return LearningToolUI.GetFeedbackResult();
end

function IsFeedbackShowing()
    local feedback = GetFeedback();
    return feedback and feedback.show;
end

function GetFeedbackText()
    local feedback = GetFeedback();
    return feedback and feedback.text or "";
end

function GetFeedbackColor()
    local feedback = GetFeedback();
    return feedback and feedback.color or "#333333";
end

function OnSelectOption(name)
    if IsFeedbackShowing() then
        return;
    end
    
    local index = tonumber(name) or 1;
    local params = GetParams();
    local correctIndex = params.correctIndex or 1;
    local isCorrect = (index == correctIndex);
    local options = GetOptions();
    
    LearningToolUI.SubmitAnswer(isCorrect, options[index], {
        selectedIndex = index,
        correctIndex = correctIndex,
    });
end

function OnPlayQuestion()
    local params = GetParams();
    local text = params.question;
    if params.word then
        text = params.word;
    end
    LearningToolUI.PlayDemoAudio(text);
end

function OnClose()
    LearningToolUI.Close({success = false, cancelled = true});
end

function IsPlayButtonEnabled()
    return not LearningToolUI.IsSpeaking();
end

function GetPlayButtonText()
    return LearningToolUI.IsSpeaking() and "播放中..." or "🔊 播放";
end
]]></script>

<div style="width:390px;background-color:#ffffff;">
    <!-- Title Bar -->
    <div style="width:390px;height:40px;background-color:#2196F3;position:relative;">
        <div style="position:relative;left:15px;top:10px;color:#ffffff;font-size:16px;font-weight:bold;">
            选择正确答案
        </div>
        <div style="position:relative;left:352px;top:6px;">
            <input type="button" value="✕" style="width:28px;height:28px;background-color:#1976D2;color:#ffffff;font-size:14px; background: url();" onclick="OnClose"/>
        </div>
    </div>
    
    <!-- Question Area -->
    <div style="width:360px;margin:15px;">
        <div style="width:360px;min-height:50px;background-color:#f5f5f5;padding:10px;">
            <div style="font-size:14px;color:#333333;">
                <%=GetQuestion()%>
            </div>
        </div>
        
        <!-- Play Button -->
        <div style="margin-top:10px;margin-left:130px;">
            <input type="button" value="<%=GetPlayButtonText()%>" style="width:100px;height:30px;background-color:#4CAF50;color:#ffffff;font-size:13px;" onclick="OnPlayQuestion" enabled="<%=IsPlayButtonEnabled()%>"/>
        </div>
    </div>
    
    <!-- Options Area -->
    <div style="width:360px;margin-left:15px;margin-bottom:15px;">
        <pe:if condition='<%=GetOptionCount() >= 1%>'>
            <input type="button" name="1" value="<%='A. '..GetOption(1)%>" style="width:360px;height:38px;margin-bottom:8px;background-color:#e3f2fd;color:#1976D2;font-size:14px; background: url();" onclick="OnSelectOption"/>
        </pe:if>
        <pe:if condition='<%=GetOptionCount() >= 2%>'>
            <input type="button" name="2" value="<%='B. '..GetOption(2)%>" style="width:360px;height:38px;margin-bottom:8px;background-color:#e3f2fd;color:#1976D2;font-size:14px; background: url();" onclick="OnSelectOption"/>
        </pe:if>
        <pe:if condition='<%=GetOptionCount() >= 3%>'>
            <input type="button" name="3" value="<%='C. '..GetOption(3)%>" style="width:360px;height:38px;margin-bottom:8px;background-color:#e3f2fd;color:#1976D2;font-size:14px; background: url();" onclick="OnSelectOption"/>
        </pe:if>
        <pe:if condition='<%=GetOptionCount() >= 4%>'>
            <input type="button" name="4" value="<%='D. '..GetOption(4)%>" style="width:360px;height:38px;margin-bottom:8px;background-color:#e3f2fd;color:#1976D2;font-size:14px; background: url();" onclick="OnSelectOption"/>
        </pe:if>
    </div>
    
    <!-- Feedback Overlay -->
    <pe:if condition='<%=IsFeedbackShowing()%>'>
        <div style="position:relative;width:390px;height:300px;margin-top:-300px;background-color:#00000080;">
            <div style="margin-left:95px;margin-top:110px;width:200px;height:80px;background-color:#ffffff;text-align:center;">
                <div style="margin-top:25px;font-size:20px;font-weight:bold;color:<%=GetFeedbackColor()%>;">
                    <%=GetFeedbackText()%>
                </div>
            </div>
        </div>
    </pe:if>
</div>
</pe:mcml>
</body>
</html>
