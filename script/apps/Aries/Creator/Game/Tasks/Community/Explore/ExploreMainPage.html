<script refresh="true" type="text/npl" src="ExploreMainPage.lua" ><![CDATA[
    local KeepworkServiceSession = NPL.load('(gl)Mod/WorldShare/service/KeepworkService/KeepworkServiceSession.lua')
    local ExploreMainPage = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Explore/ExploreMainPage.lua")
    ExploreMainPage.OnInit()

    function GetMenuData()
        return ExploreMainPage.GetMenuData()
    end

    function GetCategoryDSIndex()
        return ExploreMainPage.GetCategoryDSIndex()
    end

    function OnChangeTabview(index)
        ExploreMainPage.ChangeMenuTab(index)
    end

    function IsSearching()
        return true
    end

    function onSearch()
        ExploreMainPage.OnClickSearch()
    end

    function OnChangeSearch()
        ExploreMainPage.ChangeSearch()
    end

    function onSearchInputFocusOut()
        ExploreMainPage.OnSearchInputFocusOut()
    end

    function GridsItems(index)
        if index == nil then
            return #ExploreMainPage.worksTree
        else
            return ExploreMainPage.worksTree[index]
        end
    end

    function IsProjectSelected(index)
        return ExploreMainPage.IsProjectSelected(index)
    end

    function get_world_preview()
        return Eval("cover") and Eval("cover") or ""
    end

    function switch_world(index)
        ExploreMainPage.OnSwitchWorld(index)
    end

    function get_world_text()
        local name = Eval('name')
        name = MyCompany.Aries.Chat.BadWordFilter.FilterString(name)
        local pid = ""
        if Eval("id") and Eval("id") > 0 then
            pid =  "#" .. Eval("id")
        end
        return Mod.WorldShare.Utils.WordsLimit(name) .. pid
    end

    function get_world_date()
        local datetime = Mod.WorldShare.Utils:RecentDatetimeFormat(Mod.WorldShare.Utils:UnifiedTimestampFormat(Eval('updated_at')))
        return datetime
    end

    function is_load_more_items(index)
        if index == #ExploreMainPage.worksTree then
            return true
        end
    end

    function lazy_load()
        if ExploreMainPage.worksTree[#ExploreMainPage.worksTree].isLoaded then
            return
        end
        print("xxxxxxxxxxxxxxxxxxxxxxxx")
        ExploreMainPage.worksTree[#ExploreMainPage.worksTree].isLoaded = true
        ExploreMainPage.curPage = ExploreMainPage.curPage + 1
        
        if ExploreMainPage.isSearching then
            ExploreMainPage.Search()
        else
            ExploreMainPage:SetWorksTree()
        end
        Mod.WorldShare.MsgBox:Close()
    end

    function get_project_views()
        local total_view = Eval('total_view')

        if total_view and type(total_view) == 'number' then
            return total_view
        else
            return 0
        end
    end

    function get_project_thumbs()
        local total_like = Eval('total_like')

        if total_like and type(total_like) == 'number' then
            return total_like
        else
            return 0
        end 
    end

    function get_project_favorites()
        local total_mark = Eval('total_mark')

        if not total_mark or
        type(total_mark) ~= 'number' or
        total_mark < 0 then
            return 0
        end

        return Eval('total_mark')
    end

    function get_project_comments()
        local total_comment = Eval('total_comment')

        if total_comment and type(total_comment) == 'number' then
            return total_comment
        else
            return 0
        end 
    end

    function be_selected()
        return IsProjectSelected(Eval('index'))
    end

    function OnclickSelectWorld(name, mcmlNode)
        local index = tonumber(name)
        if index then
            switch_world(index)
        end
    end

    function share(name)
        local index = tonumber(name)
        if index then
            local currentWorld = ExploreMainPage.worksTree[index]
            GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_share", { useNoId=true},nil,true);
            if currentWorld and currentWorld.id then
                local WorldSharePage = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/ShareWorld/WorldSharePage.lua") 
                if not currentWorld.kpProjectId then
                    currentWorld.kpProjectId = currentWorld.id
                end
                WorldSharePage.ShowView(currentWorld)
            end
        end
    end

    function enter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_open_project", { useNoId=true},nil,true);
        ExploreMainPage.OnOpenProject(index)
    end

    function get_username()
        local user = Eval('user')
        local ret
        if not user or type(user) ~= 'table' then
            ret = Eval('username') or '<%= "暂无" %>'
        else 
            if user.username then
                ret = user.username
            else
                ret = Eval('username') or '<%= "暂无" %>'
            end
        end
        ret = MyCompany.Aries.Chat.BadWordFilter.FilterString(ret)
        return ret
    end

    function has_username()
        local username = Eval('username')

        if username then
            return true
        else
            return false
        end
    end

    function be_allow()
        local username = Mod.WorldShare.Store:Get('user/username')
        local user = Eval('user')
        local isSystemGroupMember = Eval('isSystemGroupMember')
        local isFreeWorld = Eval('isFreeWorld')
        local visibility = Eval('visibility')
        local level = Eval('level')
        local extra = Eval('extra')

        if not user or
            type(user) ~= 'table' or
            not user.username then
            return false
        end

        if isSystemGroupMember == nil or
            type(isSystemGroupMember) ~= 'boolean' then
            return false
        end

        if isFreeWorld == nil or
            type(isFreeWorld) ~= 'number' then
            return false
        end

        if not visibility or
            type(visibility) ~= 'number' then
            return false
        end

        if not level or
            type(level) ~= 'number' then
            return false
        end

        if not extra or
            type(extra) ~= 'table' then
            return false
        end

        -- private world verfied
        if visibility == 1 then
            if not KeepworkServiceSession:IsSignedIn() then
                return false
            else
                if level == 0 then
                    return false
                end
            end
        end

        -- vip enter
        if not isSystemGroupMember and
            ((extra.vipEnabled and extra.vipEnabled == 1) or
            (extra.isVipWorld and extra.isVipWorld == 1)) then
            if not KeepworkServiceSession:IsSignedIn() then
                return false
            else
                if user.username ~= username then
                    if not GameLogic.IsVip() then
                        return false
                    end
                end
            end
        end

        -- vip institute enter
        --[[
        if  extra.instituteVipEnabled and
            extra.instituteVipEnabled == 1 then
            if not KeepworkServiceSession:IsSignedIn() then
                return false
            else
                if not MainPage.isOrgan then
                    return false
                end
            end
        end]]

        -- system group world
        if isSystemGroupMember then
            if level == 0 then
                return false
            end
        end

        return true
    end

    function is_favorite()
        local worldinfo = ExploreMainPage.worksTree[Eval('index')]
        if not worldinfo then return 'false' end
        return worldinfo.isFavorite == true  or  worldinfo.isFavorite == "true"
    end

    function favorite(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnFavoriteProject(index)
    end

    function unfavorite(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnUnfavoriteProject(index)
    end

    function is_star()
        local worldinfo = ExploreMainPage.worksTree[Eval('index')]
        if not worldinfo then return 'false' end
        return worldinfo.isStar == true  or  worldinfo.isStar == "true"
    end

    function star(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnStarProject(index)
    end

    function unstar(index)
        if true then
            return
        end

        ExploreMainPage.OnUnstarProject(index)
    end

    function onSearch()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_search", { useNoId=true},nil,true);
        ExploreMainPage.OnClickSearch()
    end

    function OnChangeSearch()
        ExploreMainPage.ChangeSearch()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_show_search", { useNoId=true},nil,true);
    end

    function OnCloseSearch()
        ExploreMainPage.CloseSearch()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_hide_search", { useNoId=true},nil,true);
    end

    function OnMouseEnter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnBgMouseEnter(index)
    end

    function OnMouseLeave(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnBgMouseLeave(index)
    end

    function OnMousePreviewEnter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnPreviewMouseEnter(index)
    end

    function OnMousePreviewLeave(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnPreviewMouseLeave(index)
    end

    function OnMouseShareEnter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnShareMouseEnter(index)
    end

    function OnMouseShareLeave(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnShareMouseLeave(index)
    end

    function OnMouseFavoriteEnter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnFavoriteMouseEnter(index)
    end

    function OnMouseFavoriteLeave(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnFavoriteMouseLeave(index)
    end

    function OnMouseStarEnter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnStarMouseEnter(index)
    end

    function OnMouseStarLeave(name)
        local index = tonumber(name)
        if not index then
            return
        end
        ExploreMainPage.OnStarMouseLeave(index)
    end

    function OnClickFavorite(name)
        local index = tonumber(name)
        if not index then
            return
        end
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_favorite", { useNoId=true},nil,true);
        ExploreMainPage.OnClickFavorite(index)
    end

    function OnClickStar(name)
        local index = tonumber(name)
        if not index then
            return
        end
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.explore_page.click_star", { useNoId=true},nil,true);
        local isStar = ExploreMainPage.worksTree[index].isStar
        if isStar == true or isStar == "true" then
            return
        end
        star(name)
    end
]]></script>

                                    </div>
                                    <div style='float: left;margin-left: 16px;'>
                                        <img src='<%=is_star() and "Texture/Aries/Creator/keepwork/community_32bits.png#386 238 16 16" or "Texture/Aries/Creator/keepwork/community_32bits.png#341 102 16 16"%>'style='margin-top:3px; width: 16px;height: 16px;' />
                                        <div style='float:left;margin-left: 2px; margin-top: 2px;'><%= get_project_thumbs() %></div>
                                    </div>
                                    <div style='float:left;margin-left: 16px;'>
                                        
                                        <img src='<%= is_favorite() and "Texture/Aries/Creator/keepwork/community_32bits.png#266 238 16 16" or "Texture/Aries/Creator/keepwork/community_32bits.png#318 102 16 16"%>' style='width: 16px;height: 16px;margin-top: 3px;'/>
                                        <div style='float: left;margin-left: 2px; margin-top: 2px;'><%= get_project_favorites() %></div>
                                    </div>
                                </div>
                            </pe:container>
    
                            <!-- 显示锁 -->
                            <pe:if condition='<%= not be_allow() %>'>
                                <div style="position: relative; margin-left: 238px; margin-top: 165pxpx; width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#326 238 16 16)"></div>
                            </pe:if>
                            <!-- info -->
                            <div style="width: 242px; height: 120px;  margin-left: 14px; margin-top: 162px;">
                                <!-- 显示项目内容 -->
                                <div style='width: 240px; height: 32px;'>
                                    <div style="width: 210px; height: 40px; float: left; font-size: 14px; base-font-size: 14px; text-align: left; color: #d3d3d3; margin-top: 2px;">
                                        <%= get_world_text() %>
                                    </div>
                                </div>
    
                                <div style="width: 242px; height: 32px;  margin-top: 30px; ">
                                    <!-- 显示项目用户名 -->
                                    <div style='float: left; margin-top: 2px;  height: 20px; color: #b2b2b2;'>
                                        <%= get_username()%>
                                    </div>
                                    <!-- 更新时间 -->
                                    <div style='float: left; margin-top: 2px; margin-left: 8px;  height: 20px; color: #b2b2b2;'>
                                        <%= get_world_date()%>
                                    </div>
                                </div>
    
                                <div style="width: 160px; height: 32px; margin-top: -30px; margin-left: 98px;">
                                    <input type='button' name='<%= Eval("index") %>' onmouseenter="OnMouseShareEnter" onmouseleave="OnMouseShareLeave" onclick='share' value="" tooltip="<%=L'分享'%>" uiname='<%="CreateEmbed.share" .. Eval("index")%>'style='float: left; margin-left: 134px; width: 20px;height: 20px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 99 20 20);' />
                                </div>
                            </div>
                            <pe:if condition='<%= is_load_more_items(Eval("index")) %>'>
                                <pe:custom oncreate='<%= lazy_load %>'></pe:custom>
                            </pe:if>
                        </div>
                    </Columns>
                    <EmptyDataTemplate>
                        <div style='font-weight: bold;'>
                            <div align='center'style='width: 160px;height: 128px; margin-top: 160px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#2 2 160 128)'>
                            </div>
                            <div style="text-align: center; font-size: 14px; base-font-size: 14px; margin-top: -10px; color: #A8A7B0;" ><%=L"推荐项目暂无数据"%></div>
                        </div>
                    </EmptyDataTemplate>
                </pe:gridview>

            </div>
        </div>
        
    </div>
</pe:container>
</pe:mcml>
</body>
</html>
