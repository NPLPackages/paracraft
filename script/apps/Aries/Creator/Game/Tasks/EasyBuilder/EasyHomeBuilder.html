local EasyHomeBuilder = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/EasyBuilder/EasyHomeBuilder.lua")

end

function OnNextHome()
    EasyHomeBuilder.OnClickNext()
end

function OnPreHome()
    EasyHomeBuilder.OnClickPrev()
end

end

function OnConfirm()
    EasyHomeBuilder.OnClickBuild()
end
