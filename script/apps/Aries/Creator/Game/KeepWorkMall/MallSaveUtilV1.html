<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title></title>
</head>
<body>
    <pe:mcml>
        <script refresh="true" type="text/npl" src="MallSaveUtilV1.lua">
<![CDATA[
local MallUtils = NPL.load("(gl)script/apps/Aries/Creator/Game/KeepWorkMall/MallUtils.lua");
MallSaveUtil = NPL.load("(gl)script/apps/Aries/Creator/Game/KeepWorkMall/MallSaveUtilV1.lua");
MallSaveUtil.OnInit()

function ClosePage()
    MallSaveUtil.ClosePage()
end

function GetModelXmlInfo()
    local modelData = MallSaveUtil.GetModelData()
    if not modelData then
        return nil
    end
    echo(modelData.xmlInfo)
    return modelData.xmlInfo
end

function GetModelIcon()
    local modelData = MallSaveUtil.GetModelData()
    if not modelData then
        return nil
    end
    local icon = MallUtils.GetIcon(modelData)
    return icon
end

function GetId()
    local modelData = MallSaveUtil.GetModelData()
    return modelData and "物品Id:"..(modelData.id or "")
end


function GetNameText()
    local modelData = MallSaveUtil.GetModelData()
    return modelData and ((modelData.name or "").."<br/>".."类型："..(modelData.modelType or "")) or ""
end

function OnClickUpdateGood()
    MallSaveUtil.OnClickUpdateGood()
end

function OnClickRefreshGood()
    MallSaveUtil.OnClickRefreshGood()
end

function OnIdTextChange()
    MallSaveUtil.OnIdTextChange()
end

function OnRotateTextChange()
    MallSaveUtil.OnRotateTextChange()
end

function OnDistTextChange()
    MallSaveUtil.OnDistTextChange()
end

]]>
</script>
<pe:container alignment="_fi" width="100%" height="100%" style="background-color:#1a1a1acc;">
    <pe:container alignment="_ct" ClickThrough="true" style="position: relative; width: 600px; height: 400px; margin-left:-300px;margin-top:-200px; background: ;">
        <kp:window width="600" height="400" title="商城图片下载上传工具"   onclose="ClosePage">
            <div align="center" style="width: 128px; height: 128px; margin-top: 60px; background-color: #ff00ff;">
                <div style="position: relative; width: 128px; height: 128px; background: url(Texture/Aries/Creator/keepwork/Mall1/model_bg1_190x138_32bits.png#0 0 190 138);">
                    <pe:if condition="<%=MallSaveUtil.CanShowCanva3d()%>">
                        <pe:canvas3d name='MallSaveUtilCanvas3D' xmlInfo='<%=GetModelXmlInfo()%>'
                            DefaultRotY="<%=MallSaveUtil.GetDefaultRotY()%>"
                            IsInteractive="false"
                            autoRotateSpeed="0"
                            DefaultCameraObjectDist="<%=MallSaveUtil.GetDefaultCameraObjectDist()%>"
                            miniscenegraphname='MallSaveUtilCanvas3D'
                            RenderTargetSize="128" 
                            value='<%=GetModelIcon()%>'
                            style="position: relative;
                                    width: 90px;
                                    height: 90px;
                                    margin-top: 18px;
                                    margin-left: 25px;" />
                    </pe:if>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <div style="float:left; margin-left: 2px; font-size: 18px; base-font-size: 18px; font-weight: bolder;">
                    <%=L"商品ID:"%>
                    <input type="text" name="itemId" value="<%=MallSaveUtil.GetGoodId()%>" onchange='OnIdTextChange' tooltip='<%= L"输入商品ID，从Keepwork后台获取" %>' textcolor="#FFFFFFFF" CaretColor="#FFFFFFFF"  style="position:relative;margin-top:4px; margin-left:12px; width:60px; height:24px;" class="bordertext"/>
                </div>
                <div style="float:left; margin-left: 20px; font-size: 18px; base-font-size: 18px; font-weight: bolder;">
                    <%=L"商品角度:"%>
                    <input type="text" name="itemrotate" value="<%=tostring(MallSaveUtil.GetDefaultRotY())%>" onchange='OnRotateTextChange' tooltip="旋转范围是(-1.57~1.57),弧度制" textcolor="#FFFFFFFF" CaretColor="#FFFFFFFF"  style="position:relative;margin-top:4px; margin-left:12px; width:60px; height:24px;" class="bordertext"/>
                </div>
                <div style="float:left; margin-left: 20px; font-size: 18px; base-font-size: 18px; font-weight: bolder;">
                    <%=L"商品大小:"%>
                    <input type="text" name="itemdist" value="<%=tostring(MallSaveUtil.GetDefaultCameraObjectDist())%>" onchange='OnDistTextChange' tooltip="大小范围是(1.0~10.0),越大显示越小" textcolor="#FFFFFFFF" CaretColor="#FFFFFFFF"  style="position:relative;margin-top:4px; margin-left:12px; width:60px; height:24px;" class="bordertext"/>
                </div>
                <div style="margin-left: 2px; margin-top: 20px; font-size: 18px; base-font-size: 18px; font-weight: bolder;"><%=GetNameText()%></div>
            </div>
            <input type="button" onclick="OnClickRefreshGood" value="刷新" style="margin-top: 36px; margin-left: 150px; width: 100px; height: 40px; background: url(Texture/Aries/Creator/keepwork/Window/button/huanganniu_32x32_32bits.png#0 0 32 32:14 14 14 14);" />
            <input type="button" onclick="OnClickUpdateGood" value="上传" style="margin-top: 36px;  margin-left: 30px;width: 100px; height: 40px; background: url(Texture/Aries/Creator/keepwork/Window/button/huanganniu_32x32_32bits.png#0 0 32 32:14 14 14 14);" />
        </kp:window>
    </pe:container>
</pe:container>
</pe:mcml>
</body>
</html>
