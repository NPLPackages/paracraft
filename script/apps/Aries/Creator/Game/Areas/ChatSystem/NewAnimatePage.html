<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" >
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title></title>
</head>
<body>
<pe:mcml>
<script type="text/npl" src="NewSmileyPage.lua"><![CDATA[
local pageCtrl = document:GetPageCtrl();
local NewSmileyPage = NPL.load("(gl)script/apps/Aries/Creator/Game/Areas/ChatSystem/NewSmileyPage.lua");
NewSmileyPage.OnInit();
function DS_Func_Anims(index)
    return NewSmileyPage.DS_Func_Anims(index);
end
function ClosePage()
    NewSmileyPage.ClosePage()
end

function OnClickIcon(index)
    NewSmileyPage.OnClickAnim(index);
    ClosePage();
end
]]></script>

<div style="padding-left:10px;padding-top:10px;padding-bottom:10px;background:Texture/Aries/Creator/keepwork/Community/community_chat_32bits.png#228 40 32 32:14 14 14 14">
    <div style="width: 280px; ">
        <pe:gridview name="DS_Func_Anims" 
                DataSource="<%=DS_Func_Anims%>" 
                VerticalScrollBarStep="34" 
                CellPadding="0"  
                DefaultNodeHeight = "34" 
                VerticalScrollBarOffsetX="6"
                ItemsPerLine="5" 
                AllowPaging="false" 
                pagesize="250">
            <Columns>
                <a width="52" height="52" tooltip='<%=Eval("displayname")%>' style="padding:6px;background-color: #111113; background:url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14)"
                    onclick="OnClickIcon" param1='<%=Eval("index")%>'>
                    <div zorder="1" style="<%=string.format('width:40px;height:40px; background:url(%s);',Eval('smallicon'))%>"></div>
                </a>
            </Columns>
            <EmptyDataTemplate>
            </EmptyDataTemplate>
            <FetchingDataTemplate>
            </FetchingDataTemplate>
        </pe:gridview>
    </div>
</div>
</pe:mcml> 
</body>
</html>
