<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" >
<html>
<body>
<pe:mcml>
<script type='text/npl'>
    <![CDATA[
    CommunityProjectDialog = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Project/CommunityProjectDialog.lua")
    CommunityProjectDialog.OnInit()
    
    function OnClose()
        CommunityProjectDialog.OnClose()
    end

    function on_confirm()
        CommunityProjectDialog.OnConfirmClick()
    end
    
    function on_cancel()
        CommunityProjectDialog.OnCloseClick()
    end

    function GetButtonText(type)
        if type == 1 then
            return (CommunityProjectDialog.options and CommunityProjectDialog.options.confirm_text) and CommunityProjectDialog.options.confirm_text or L"确定"
        elseif type == 2 then
            return (CommunityProjectDialog.options and CommunityProjectDialog.options.cancel_text) and CommunityProjectDialog.options.cancel_text or L"取消"
        end
    end

    function GetDialogTitle()
        return (CommunityProjectDialog.options and CommunityProjectDialog.options.dialog_title) and CommunityProjectDialog.options.dialog_title or L"提示"
    end

    function IsReminder()
        local is_reminder = (CommunityProjectDialog.options and CommunityProjectDialog.options.is_reminder) and CommunityProjectDialog.options.is_reminder == true
        print("is_reminder", is_reminder)
        echo(CommunityProjectDialog.options,true)
        return is_reminder
    end

    function GetHeight()
        if IsReminder() then
            return 280
        else
            return 220
        end
    end
    ]]>
</script>
<pe:container ClickThrough="false" alignment="_fi" width="100%" height="100%" style="background-color: #141414cc;">
    <pe:container alignment="_ct" width="500" height="<%=GetHeight()%>" style="margin-left:-250px;margin-top:-100px;background-color: #2e2e2e; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14)">
        <div style="width: 500px;">
            <div style="width: 500px;height: 54px;margin-top: 0px; background:url()">
                <div style="float: left;margin-left: 20px;margin-top: 6px;color: #ffffff;font-size: 18px;base-font-size: 18px;font-weight: bold;"><%=GetDialogTitle()%></div>
                <div onclick="OnClose()" style="float: left;margin-left: 470px;margin-top: -20px;width: 16px;height: 16px; background: Texture/Aries/Creator/paracraft/Educate/guanbi_14x14_32bits.png#0 0 14 14;"></div>
            </div>
            <div style="position: relative; width: 500px; height: 1px; margin-left: 0px; margin-top: -2px; background-color: #FFFFFF22"></div>
            
            <div style="width: 500px;">
                <pe:if condition="<%=IsReminder()%>">
                    <div align="center" style="margin-top: 24px; width: 44px; height: 44px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#810 4 44 44)"></div>
                </pe:if>
                <div style="color: #ffffff; width: 440px; text-align: center; margin-left: 30px; font-size: 16px;base-font-size: 16px; font-weight: bold; margin-top: 22px;">
                    <div><%=CommunityProjectDialog.dialog_description%></div>
                </div>
                <div style="margin-left: 24px; margin-top: 24px;">
                    <div style="float: left; width: 220px; height: 44px;background-color: #ffffff22; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                        <input type="button" value='<%=GetButtonText(2)%>' onclick="on_cancel"  style="color: #d3d3d3; margin-left: 1px; margin-top: 1px; width: 218px; height: 42px; background-color: #2E2E2E; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);"/>
                    </div>
                    <div style="float: left; margin-left: 12px; width: 220px; height: 44px;background-color: #ffffff22; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                        <input type="button" value='<%=GetButtonText(1)%>' onclick="on_confirm"  style="color: #d3d3d3; margin-left: 1px; margin-top: 1px; width: 218px; height: 42px; background-color: #2E2E2E; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);"/>
                    </div>
                </div>                     
            </div>
        </div>
    </pe:container>
</pe:container>
</pe:mcml>
</body>
</html>
