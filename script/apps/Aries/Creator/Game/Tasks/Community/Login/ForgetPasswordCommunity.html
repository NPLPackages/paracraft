<html>
    <body>
        <pe:mcml>
            <script type="text/npl" refresh="false">
                <![CDATA[
                    local ForgetPassword = NPL.load("(gl)Mod/WorldShare/cellar/ForgetPassword/ForgetPassword.lua")
                    local KeepworkServiceSession = NPL.load("(gl)Mod/WorldShare/Service/KeepworkService/KeepworkServiceSession.lua")
                    local Validated = NPL.load("(gl)Mod/WorldShare/helper/Validated.lua")
                    local Desktop = commonlib.gettable("MyCompany.Aries.Creator.Game.Desktop")

                    local account_type
                    local no_phonenumber = true
                    local no_email = true
                    page = document:GetPageCtrl()
                    Mod.WorldShare.Store:Set('page/ForgetPassword', page)

                    function is_english()
                        return Mod.WorldShare.Utils.IsEnglish()
                    end

                    function get_english_style(styleStr)
                        if is_english() then
                            return styleStr
                        else
                            return ''
                        end
                    end

                    function close()
                        if ForgetPassword.isKick then
                            Desktop.ForceExit(false)
                        else
                            page:CloseWindow()
                        end
                    end

                    function reset()
                        ForgetPassword:Reset()
                    end

                    local isClickedGetCaptcha = false

                    function get_captcha()
                        account_type = nil

                        local account = page:GetValue("key")

                        if Validated:Email(account) then
                            account_type = 'email'
                        end

                        if Validated:Phone(account) then
                            account_type = 'phone'
                        end

                        if not account_type then
                            GameLogic.AddBBS(nil, L"账号格式错误", 3000, "255 0 0")
                            ForgetPassword:SetErrorMsg(L"账号格式错误",1)
                            return false
                        end

                        if isClickedGetCaptcha then
                            return false 
                        end

                        isClickedGetCaptcha = true

                        local times = 60

                        local timer = commonlib.Timer:new({
                            callbackFunc = function(timer)
                                page:SetValue("getCaptcha", format("%s(%ds)", L"重新发送", times))

                                if times == 0 then
                                    isClickedGetCaptcha = false
                                    page:SetValue("getCaptcha", L"获取验证码")
                                    timer:Change(nil, nil)
                                end

                                times = times - 1
                            end
                        })

                        if account_type == 'phone' then
                            if no_phonenumber then
                                GameLogic.AddBBS(nil, L"所输入手机号未绑定账号", 3000, "255 0 0")
                                ForgetPassword:SetErrorMsg(L"所输入手机号未绑定账号",1)
                                return false
                            end

                            KeepworkServiceSession:GetPhoneCaptcha(account, function(data, err)
                                if err ~= 200 then
                                    isClickedGetCaptcha = false
                                    page:SetValue("getCaptcha", L"获取验证码")

                                    if data and data.code and data.message then
                                        GameLogic.AddBBS(nil, format(L"发送验证码失败，错误信息：%s(%d)", data.message, data.code), 3000, "255 0 0")
                                        ForgetPassword:SetErrorMsg(format(L"发送验证码失败，错误信息：%s(%d)", data.message, data.code),2)
                                    else
                                        GameLogic.AddBBS(nil, L"发送验证码失败", 3000, "255 0 0")
                                        ForgetPassword:SetErrorMsg(L"发送验证码失败",2)
                                    end

                                    timer:Change(nil, nil)
                                    return false
                                end
                            end)
                        end

                        if account_type == 'email' then
                            if no_email then
                                GameLogic.AddBBS(nil, L"所输入Email未绑定账号", 3000, "255 0 0")
                                ForgetPassword:SetErrorMsg(L"所输入Email未绑定账号",1)
                                return false
                            end

                            KeepworkServiceSession:GetEmailCaptcha(account, function(data, err)
                                if err == 500 then
                                    isClickedGetCaptcha = false
                                    page:SetValue("getCaptcha", L"获取验证码")
                                    GameLogic.AddBBS(nil, L"发送验证码失败", 3000, "255 0 0")
                                    ForgetPassword:SetErrorMsg(L"发送验证码失败",2)
                                    timer:Change(nil, nil)
                                end
                            end)
                        end

                        timer:Change(1000, 1000)
                    end

                    function checkout_account()
                        account_type = nil

                        local account = page:GetValue("key")

                        if Validated:Email(account) then
                            account_type = 'email'
                        end

                        if Validated:Phone(account) then
                            account_type = 'phone'
                        end

                        if not account_type then
                            GameLogic.AddBBS(nil, L"账号格式错误", 3000, "255 0 0")
                            ForgetPassword:SetErrorMsg(L"账号格式错误",1)
                            return false
                        end

                        if account_type == 'email' then
                            KeepworkServiceSession:CheckEmailExist(account, function(bExisted)
                                if bExisted then
                                    no_email = false
                                else
                                    no_email = true
                                    GameLogic.AddBBS(nil, L"所输入Email未绑定账号", 3000, "255 0 0")
                                    ForgetPassword:SetErrorMsg(L"所输入Email未绑定账号",1)
                                end
                            end)
                        end
                        
                        if account_type == 'phone' then
                            KeepworkServiceSession:CheckPhonenumberExist(account, function(bExisted)
                                if bExisted then
                                    no_phonenumber = false
                                else
                                    no_phonenumber = true
                                    GameLogic.AddBBS(nil, L"所输入手机号未绑定账号", 3000, "255 0 0")
                                    ForgetPassword:SetErrorMsg(L"所输入手机号未绑定账号",1)
                                end
                            end)
                        end
                    end
                ]]>
            </script>
            <style type="text/mcss">
                {
                    main_area = {
                        width = 450,
                        ['min-height'] = 550,
                        ["base-font-size"] = 16,
                        ["font-size"] = 16,
                        color = "#d3d3d3",
                        ["padding-left"] = 75,
                        ["padding-right"] = 75,
                    },
                }
            </style>
            <pe:container alignment='_ct' style='position: relative; width: 450px; height: 550px; margin-left: -225px; margin-top: -275px; background-color: #353536; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14); '>
                <div class="main_area">
                    <pe:container name="forget_password_field_error" visible="false" style="position: relative; margin-top: 222px; background:">
                        <div>
                            <label style="font-size: 12px;base-font-size: 12px;color: #FC3632;"  name="forget_password_field_error_msg" />
                        </div>
                    </pe:container>
                    <pe:container name="forget_password_captcha_field_error" visible="false" style="position: relative; margin-top: 312px; background:">
                        <div>
                            <label style="font-size: 12px;base-font-size: 12px;color: #FC3632;"  name="forget_password_captcha_field_error_msg" />
                        </div>
                    </pe:container>
                    <pe:container name="forget_password_password_field_error" visible="false"  style="position: relative; margin-top: 402px;  background:">
                        <div>
                            <label style="font-size: 12px;base-font-size: 12px;color: #FC3632;" name="forget_password_password_field_error_msg" />
                        </div>
                    </pe:container>
                    <div style='position: relative;'>
                        <div style='margin-left: 0px;
                                   margin-top: 36px;'>
                           <input type='button' onclick='close' value='<%= L"返回登录" %>'
                             icon="Texture/Aries/Creator/keepwork/community_32bits.png;306 238 16 16" icon_width="16" icon_height="16" icon_off_x="-44"
                            style='width: 100px; height: 30px; background: url(); color: #d3d3d3; font-size: 14px; text-offset-x:-10;'  />
                       </div>
                   </div>
                    <div style="width: 300px;height: 320px; margin-top: 80px; ">
                        <div style="color: #d3d3d3; text-align: center; font-size: 24px; base-font-size: 24px; font-weight: bold;">
                            <%= L"重置密码" %>
                        </div>
                        <div style="margin-top: 40px;">
                            <div style="width: 180px; height: 20px;">
                                <div style="float: left; width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#366 238 16 16);"></div>
                                <div style="float: left; margin-left: 10px; margin-top: -4px; color: #d3d3d3;"><%=L"手机号/EMAIL"%></div>
                            </div>
                            <div style="margin-top: 10px; width: 300px; height: 40px; background-color: #2b2b2b; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                                <input type="text"
                                    EmptyText='<%= L"请输入手机号/EMAIL" %>'
                                    style='background:;
                                            textcolor: #d3d3d3;
                                            height: 30px;
                                            width: 260px;
                                            margin-top: 6px;
                                            margin-left: 12px;
                                            font-size: 14px;
                                            base-font-size: 14px;'
                                    onfocusout="checkout_account"
                                    name="key" />
                            </div>  
                        </div>
                        <div style="margin-top:20px;">
                            <div style="width: 160px; height: 20px;">
                                <div style="float: left; width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#666 2 20 20);"></div>
                                <div style="float: left; margin-left: 10px; margin-top: -4px; color: #d3d3d3;"><%=L"验证码"%></div>
                            </div>
                            <div style="margin-top: 10px; width: 165px; height: 40px; background-color: #2b2b2b; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                                <input
                                    type="text"
                                    EmptyText='<%= L"请输入验证码" %>'
                                    style='background:;
                                            textcolor: #d3d3d3;
                                            height: 30px;
                                            width: 160px;
                                            margin-top: 6px;
                                            margin-left: 12px;
                                            font-size: 14px;
                                            base-font-size: 14px;'
                                    name="captcha" />
                            </div>
                            
                            <input
                                type="button"
                                name="getCaptcha"
                                style="margin-top: -40px;
                                    margin-left:182px;
                                    color: #3E9CE5;
                                    font-size: 14px;
                                    base-font-size: 14px;
                                    width: 120px;
                                    height:40px;
                                    color: #d3d3d3;
                                    background: url(Texture/Aries/Creator/paracraft/paracraft_login_32bits.png#331 70 90 22:5 5 5 5)"
                                onclick="get_captcha()"
                                disabled="disabled"
                                value='<%= L"获取验证码"%>'
                            />
                        </div>
                        <div style="margin-top:20px;">
                            <div style="width: 160px; height: 20px;">
                                <div style="float: left; width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#346 238 16 16);"></div>
                                <div style="float: left; margin-left: 10px; margin-top: -2px; color: #d3d3d3;"><%=L"新密码"%></div>
                            </div>
                            <div style="margin-top: 10px; width: 300px; height: 40px; background-color: #2b2b2b; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                                <input type="text"
                                    PasswordChar="*"
                                    EmptyText='<%= L"请输入新密码" %>'
                                    style='background:;
                                            textcolor: #d3d3d3;
                                            height: 30px;
                                            width: 260px;
                                            margin-top: 6px;
                                            margin-left: 12px;
                                            font-size: 14px;
                                            base-font-size: 14px;'
                                    name="password" />
                            </div> 
                        </div>
                    </div>
                    
                    <div style="margin-top: 50px;">
                        <input type='button'
                            style='margin-top: 20px;width: 300px;
                            height: 44px;
                            color: #d3d3d3;
                            background-color: #404BF5;
                            background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);'
                            onclick='reset()'
                            value='<%= L"确认重置"%>' />
                    </div>
                </div>
            </pe:container>
        </pe:mcml>
    </body>
</html>
