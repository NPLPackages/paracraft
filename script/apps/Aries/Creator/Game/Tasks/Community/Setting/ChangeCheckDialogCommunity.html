<!-- "script/apps/Aries/Creator/Game/Login/ClientUpdate/ChangeCheckDialog.html" -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" >
<html>
<body>
<pe:mcml>
<script type='text/npl'>
    <![CDATA[
    ChangeVersion = NPL.load("(gl)script/apps/Aries/Creator/Game/Login/ClientUpdate/ChangeVersion.lua")
    --ChangeVersion.OnInit()
    change_vesion = Page:GetRequestParam('version')
    current_version = ChangeVersion.current_version
    function OnClose()
        Page:CloseWindow();
    end

    function update()
        ChangeVersion.ChangeVersion(change_vesion)
        OnClose()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.version_check_page.click_confirm", {useNoId=true},nil,true);
    end
    
    function cancel()
        OnClose()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.version_check_page.click_cancel", {useNoId=true},nil,true);
    end
    ]]>
</script>
<pe:container ClickThrough="false" alignment="_fi" width="100%" height="100%" style="background-color: #141414cc;">
    <pe:container alignment="_ct" width="500" height="200" style="margin-left:-250px;margin-top:-100px;background-color: #2e2e2e; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14)">
        <div style="width: 500px;height: 200px;">
            <div style="width: 500px;height: 54px;margin-top: 0px; background:url()">
                <div style="float: left;margin-left: 20px;margin-top: 6px;color: #ffffff;font-size: 18px;base-font-size: 18px;font-weight: bold;"><%=L"确认"%></div>
                <div onclick="OnClose()" style="float: left;margin-left: 470px;margin-top: -20px;width: 16px;height: 16px; background: Texture/Aries/Creator/paracraft/Educate/guanbi_14x14_32bits.png#0 0 14 14;"></div>
            </div>
            <div style="position: relative; width: 500px; height: 1px; margin-left: 0px; margin-top: -2px; background-color: #FFFFFF22"></div>
            <div style="width: 500px;height: 160px;">
                <div style="position: relative; color: #ffffff; text-align: center; margin-left: 0px; font-size: 16px;base-font-size: 16px; font-weight: bold; margin-top: 22px;">
                    <div><%=format(L"是否从当前版本：%s 切换到其他版本：%s", current_version,change_vesion)%></div>
                </div>
                <div style="margin-left: 24px; margin-top: 80px;">
                    <div style="float: left; width: 220px; height: 36px;background-color: #ffffff; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                        <input type="button" value='<%=L"取消"%>' onclick="cancel"  style="color: #ffffff; margin-left: 1px; margin-top: 1px; width: 218px; height: 34px; background-color: #2E2E2E; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);"/>
                    </div>
                    <input type="button" value='<%=L"确定"%>' onclick="update"  style="float: left; color: #ffffff; margin-left: 12px; width: 220px; height: 36px; background-color: #404BF5; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);"/>
                </div>                     
            </div>
        </div>
    </pe:container>
</pe:container>
</pe:mcml>
</body>
</html>
