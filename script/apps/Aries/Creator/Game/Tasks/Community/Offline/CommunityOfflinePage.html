<html>
<body> 
<pe:mcml>
<script type="text/npl">
<![CDATA[
    local CommunityOfflinePage =NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Offline/CommunityOfflinePage.lua")
    CommunityOfflinePage.OnInit()

    local page = document:GetPageCtrl()

    function OnClose()
        CommunityOfflinePage.CloseWindow()
    end

    function OnCreateWorld()
        local CommunityWorldModule = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Offline/CommunityWorldModule.lua")
        CommunityWorldModule.ShowPage()
    end

    function GridsItems(index)
        if index == nil then
            return #CommunityOfflinePage.pageList
        else
            return CommunityOfflinePage.pageList[index]
        end
    end


    function get_world_preview()
        local status = Eval('status')
        local empty_preview = 'Texture/Aries/Creator/paracraft/konbaitu_266x134_x2_32bits.png# 0 0 532 268'
        if tonumber(status) == 2 then
            local project = Eval('project')

            if not project or
                type(project) ~= 'table' or
                not project.extra or
                type(project.extra) ~= 'table' or
                not project.extra.imageUrl or
                type(project.extra.imageUrl) ~= 'string' or
                project.extra.imageUrl == '' then
                return empty_preview
            end

            return project.extra.imageUrl
        else
            local worldpath = Eval('worldpath')

            if not worldpath or type(worldpath) ~= 'string' then
                return empty_preview
            end

            local preview = worldpath .. 'preview.jpg'

            if ParaIO.DoesFileExist(preview) then
                return preview
            else
                return empty_preview
            end
        end
    end

    function is_modifying()
        return CommunityOfflinePage.is_modify_world_name
    end

    function switch_world(index)
        CommunityOfflinePage.is_modify_world_name = false
        CommunityOfflinePage.OnSwitchWorld(index)
    end

    function covert_status(index)
        local index = tonumber(index)
        if not index or index == 0 then
            return
        end
        CommunityOfflinePage.OnSwitchWorld(index)
        
        
        local currentWorld = Mod.WorldShare.Store:Get('world/currentWorld')
        local currentEnterWorld = Mod.WorldShare.Store:Get('world/currentEnterWorld')
        if currentEnterWorld and
            currentEnterWorld.foldername == currentWorld.foldername then
            GameLogic.AddBBS(nil, L'不能重命名当前编辑的世界', 3000, '255 0 0')
            return
        end
        if CommunityOfflinePage.is_modify_world_name then
            -- 客户端处理铭感词
            local temp = MyCompany.Aries.Chat.BadWordFilter.FilterString2(temp_modify_worldname);
            if temp~=temp_modify_worldname then 
                _guihelper.MessageBox(L"该世界名称不可用，请重新设定");
                return
            end

            local count = ParaMisc.GetUnicodeCharNum(temp_modify_worldname);
            if count > 66 then
                _guihelper.MessageBox(format(L'世界名字超过%d个字符, 请重新输入', 66))
                return
            end

            -- update world name
            if CommunityOfflinePage.WorldRename(
                index,
                temp_modify_worldname,
                function()
                    CommunityOfflinePage.GetProjectList(CommunityOfflinePage.statusFilter, function()
                        switch_world(index)
                    end)
                end
            ) then
                temp_modify_worldname = ''
            else
                temp_modify_worldname = ''
                CommunityOfflinePage.is_modify_world_name = not CommunityOfflinePage.is_modify_world_name
                page:Refresh(0.1)
            end
            return
        end
        CommunityOfflinePage.is_modify_world_name = not CommunityOfflinePage.is_modify_world_name
        page:Refresh(0.1)
    end

    function get_tagname()
        if Eval('name') and Eval('name') ~= '' then
            return Eval('name')
        end
    end

    function get_world_text()
        if not Eval('text') or type(Eval('text')) ~= 'string' then
            return ''
        end
        local text = Eval('text')
        local pid = ""
        if Eval("hasPid") then
            pid = " #"..Eval("kpProjectId")
        end
        text = MyCompany.Aries.Chat.BadWordFilter.FilterString(text)
        text = text or ""
        local max_len = 334
        text = commonlib.GetLimitLabelByTextWidth(text,max_len,"System;12;norm")

        if Eval('is_zip') == true then
            text = text .. '.zip'
        end
        text = text.. pid
        return text
    end

    function get_world_date()
        local datetime = CommunityOfflinePage.GetCurWorldInfo('modifyTime', Eval('index'))
        datetime = Mod.WorldShare.Utils:RecentDatetimeFormat(datetime)
        return datetime
    end

    function lazy_load()
        CommunityOfflinePage.curPage = CommunityOfflinePage.curPage + 1

        CommunityOfflinePage:GetPageList()
    end

    function is_load_more_items(index)
        if not CommunityOfflinePage.currentWorldList or
            type(CommunityOfflinePage.currentWorldList) ~= 'table' then
            return false
        end

        if index >= #CommunityOfflinePage.currentWorldList then
            return false
        end

        if index == #CommunityOfflinePage.pageList then
            return true
        end
    end

    function OnProjectNameFocusOut(name, mcmlNode)
        local index = tonumber(name)
        if index and CommunityOfflinePage.is_modify_world_name then
            covert_status(index)
            GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.offline.click_change_name", {useNoId=true},true,true);
        end
    end

    function OnProjectNameKeyUp(name, mcmlNode)
        if(virtual_key == Event_Mapping.EM_KEY_RETURN or virtual_key == Event_Mapping.EM_KEY_NUMPADENTER) then
            OnProjectNameFocusOut(name, mcmlNode)
        end
    end

    function OnMouseEnterProjectName(name, mcmlNode)
        local index = tonumber(name)
        if index then
            CommunityOfflinePage.OnMouseEnterImp(index,true)
        end
    end

    function OnMouseLeaveProjectName(name, mcmlNode)
        local index = tonumber(name)
        if index then
            CommunityOfflinePage.OnMouseLeaveImp(index,true)
        end
    end

    function OnProjectNameFocusIn(name, mcmlNode)
        local index = tonumber(name)
        if index then
            CommunityOfflinePage.OnMouseEnterImp(index,true)
        end
    end
    

    function OnclickConfirmModify(name,mcmlNode)
        OnProjectNameFocusOut(name, mcmlNode)
    end

    function update_temp_modify_worldname(name, mcmlNode)
        temp_modify_worldname = mcmlNode:GetUIValue()
    end

    function IsProjectSelected(index)
        return CommunityOfflinePage.IsProjectSelected(index)
    end

    function be_selected()
        return IsProjectSelected(Eval('index'))
    end

    function OnclickSelectWorld(name, mcmlNode)
        local index = tonumber(name)
        if index then
            switch_world(index)
            page:Refresh(0.1)
        end
    end

    function OnclickShowExtra(name)
        local index = tonumber(name)
        if not index then
            return
        end
        switch_world(index)
        CommunityOfflinePage.ShowExtraPanel()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.offline.click_extra", {useNoId=true},true,true);
    end

    function enter(name)
        local index = tonumber(name)
        if not index then
            return
        end
        switch_world(index)
        CommunityOfflinePage.OnOpenProject(index)
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.offline.click_enter", {useNoId=true},true,true);
    end

    function OnMouseEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        CommunityOfflinePage.OnBgMouseEnter(index)
    end

    function OnMouseLeave(name)
        local index = tonumber(name)
        CommunityOfflinePage.OnBgMouseLeave(index)
    end

    function OnMousePreviewEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        CommunityOfflinePage.OnPreviewMouseEnter(index)
    end

    function OnMousePreviewLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        CommunityOfflinePage.OnPreviewMouseLeave(index)
    end  

    function OnMouseMoreEnter(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        CommunityOfflinePage.OnMoreMouseEnter(index)
    end

    function OnMouseMoreLeave(name)
        local index = tonumber(name)
        if not index or not page then
            return
        end
        CommunityOfflinePage.OnMoreMouseLeave(index)
    end
]]>
</script>
<pe:container alignment="_fi" width="100%" height="100%" style="background-color:#1a1a1a;">
    <pe:container zorder="2" alignment="_mt" width="0" height="56" style="position: relative; background-color:#262626;">
        <input type="button"  onclick="OnClose" style="position: relative; margin-top: 6px; margin-left: 4px; width: 32px; height: 32px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#710 38 32 32);"/>
        <div style="position: relative; font-size: 18px; base-font-size: 18px; color: #FFFFFF; font-weight: bold; margin-top: 10px; margin-left: 60px;"><%=L"本地模式"%></div>
        <pe:container zorder="1" alignment="_rt" ClickThrough="true" style="position: relative; width: 200px; height: 70px; margin-top: 8px; background: url();">
            <div align="right" style="margin-right: 20px; width: 100px; height: 40px; background-color: #FFFFFF; background:url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);">
                <input type="button" value="<%=L'新建项目'%>" onclick="OnCreateWorld" style="color: #ffffff; margin-left: 1px; margin-top: 1px; width: 98px; height: 38px; background-color: #2E2E2E; background:url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14);"/>
            </div>
        </pe:container>
    </pe:container>
    <pe:container alignment="_ct"  style="position: relative; width: 1240px; height: 610px; margin-left:-620px;margin-top:-273px; background: url();">
        <!-- 项目列表 -->
        <div style=" margin-left: 10px;  width: 1160px; ">
            <pe:gridview name='gw_offline_world_ds' 
                    style="width: 1160px; height: 580px;"
                    VerticalScrollBarOffsetX="12000"  
                    RememberScrollPos='true' 
                    AllowPaging='false' 
                    VerticalScrollBarStep='70' 
                    DefaultNodeHeight='260' 
                    CellPadding='4' 
                    ItemsPerLine='4'
                    DataSource="<%= GridsItems %>"
                    onmousewheel='NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Offline/CommunityOfflinePage.lua").OnMouseWheel()'>
                <Columns>
                    <div style="width: 278px; height: 260px; ">
                        <pe:container ClickThrough="true" visible="true" name="<%='project_bg'..Eval('index')%>" zorder="-3" style="position: relative; width: 278px; height: 258px; background: url();"></pe:container>
                        <pe:container ClickThrough="true" visible="false" name="<%='project_select_bg'..Eval('index')%>" zorder="-3" style="position: relative; width: 278px; height: 258px; background-color: #262626; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);"></pe:container>
                        <input type="button" zorder="-3" name="<%=Eval('index')%>" onmouseenter="OnMouseEnter" onmouseleave="OnMouseLeave" style="position: relative; width: 278px; height: 258px; background: url();" />
                        <input type="button" zorder="-2" name="<%=Eval('index')%>" onmouseenter="OnMousePreviewEnter" onmouseleave="OnMousePreviewLeave" onclick="enter" style="position: relative; margin-left: 12px; margin-top: 12px; width: 254px; height: 142px; background: url();" />
                        <div style="position: relative; width: 254px; height: 142px; margin-left: 12px; margin-top: 12px; background: url();">
                            <div style='<%= "position: relative; width: 253px; height: 141px;  background: url(" .. get_world_preview() .. ")" %>'></div>
                            <!-- 圆角遮挡 -->
                            <pe:container ClickThrough="true" visible="true" name='<%="project_preview_border_normal_bg"..Eval("index")%>' zorder="2" style='position: relative;   width: 254px; height: 142px;background-color: #1a1a1a; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#229 7 32 32:14 14 14 14);'></pe:container>
                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_border_select_bg"..Eval("index")%>' zorder="2" style='position: relative;  width: 254px; height: 142px;background-color: #262626; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#229 7 32 32:14 14 14 14);'></pe:container>

                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_select1_bg"..Eval("index")%>' zorder="1" style='position: relative; margin-left: -1px; margin-top: -1px; width: 254px; height: 142px;background-color: #0000007F; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);'>
                                <div align="center" style="margin-top: 54px; width: 72px; height: 32px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#418 145 32 32:14 14 14 14);">
                                    <pe:if condition="<%=not Mod.WorldShare.Utils.IsEnglish()%>">
                                        <div style="float: left; margin-left: 13px; font-size: 12px; base-font-size: 12px; font-weight: bold; color: #ffffff; margin-top: 6px;"><%=L"进入"%></div>
                                        <div style="float: left; margin-left: 4px; margin-top: 8px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#190 78 16 16); "></div>
                                    </pe:if>
                                    <pe:if condition="<%=Mod.WorldShare.Utils.IsEnglish()%>">
                                        <div style="float: left; margin-left: 10px; font-size: 12px; base-font-size: 12px; font-weight: bold; color: #ffffff; margin-top: 6px;"><%=L"进入"%></div>
                                        <div style="float: left; margin-left: 4px; margin-top: 8px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#190 78 16 16); "></div>
                                    </pe:if>
                                </div>
                            </pe:container>
                            <pe:container ClickThrough="true" visible="false" name='<%="project_preview_select2_bg"..Eval("index")%>' zorder="1" style='position: relative; margin-left: -1px; margin-top: -1px; width: 254px; height: 142px;background-color: #0000008F; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);'>
                                <div align="center" style="margin-top: 54px; width: 72px; height: 32px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#418 145 32 32:14 14 14 14);">
                                    <pe:if condition="<%=not Mod.WorldShare.Utils.IsEnglish()%>">
                                        <div style="float: left; margin-left: 13px; font-size: 12px; base-font-size: 12px; font-weight: bold; color: #ffffff; margin-top: 6px;"><%=L"进入"%></div>
                                        <div style="float: left; margin-left: 4px; margin-top: 8px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#190 78 16 16); "></div>
                                    </pe:if>
                                    <pe:if condition="<%=Mod.WorldShare.Utils.IsEnglish()%>">
                                        <div style="float: left; margin-left: 10px; font-size: 12px; base-font-size: 12px; font-weight: bold; color: #ffffff; margin-top: 6px;"><%=L"进入"%></div>
                                        <div style="float: left; margin-left: 4px; margin-top: 8px;width: 16px; height: 16px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#190 78 16 16); "></div>
                                    </pe:if>
                                </div>
                            </pe:container>
                        </div>

                        

                        <div style="width: 254px; height: 100px;  margin-left: 14px; margin-top: 162px;">
                            <!-- 显示项目内容 -->
                            <div style='width: 254px; height: 40px;'>
                                <pe:if condition="<%=is_modifying() and be_selected() %>">
                                    <div style="width: 254px; height: 40px; margin-top: 2px; margin-left: 0px; ">
                                        <div style='float: left;
                                                margin-left: 0px;
                                                width: 226px;
                                                height: 40px;
                                                background-color: #1a1a1a; 
                                                background: url(Texture/Aries/Creator/keepwork/community_32bits.png#188 6 32 32:14 14 14 14);'>
                                            <input type='text' 
                                                uiname='<%="CreateEmbed.modify_worldname"..Eval("index")%>' 
                                                name="<%=Eval('index')%>" 
                                                onchange='update_temp_modify_worldname' 
                                                SkipAutoBadWordFilter="true"
                                                autofocus="true"
                                                onfocusin="OnProjectNameFocusIn"
                                                onfocusout="OnProjectNameFocusOut"
                                                onkeyup="OnProjectNameKeyUp"
                                                onmouseenter="OnMouseEnterProjectName"
                                                onmouseleave="OnMouseLeaveProjectName"
                                                textcolor="#ffffff"
                                                style='height: 36px; margin-top: 6px;background: url();'
                                                value='<%= get_tagname() %>'
                                                spacing='4' />
                                        </div>
                                        <input type="button" 
                                            value="" 
                                            uiname='<%="CreateEmbed.modify_worldname_button"..Eval("index")%>' 
                                            name="<%=Eval('index')%>" 
                                            onmouseenter="OnMouseEnterProjectName"
                                            onmouseleave="OnMouseLeaveProjectName"
                                            onclick="OnclickConfirmModify" 
                                            style="float: left; margin-left: 12px; margin-top: 12px; width: 16px; height: 16px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#352 176 32 32)"/>
                                    </div>
                                    
                                </pe:if>
                                <pe:if condition='<%= not is_modifying() or not be_selected() %>'>
                                    <div style="float: left; width: 250px; height: 40px;  font-size: 14px; base-font-size: 14px; text-align: left; color: #d3d3d3; margin-top: 2px;">
                                        <%= get_world_text() %>
                                    </div>
                                </pe:if>
                            </div>

                            <div style="width: 254px; height: 20px; margin-top: 22px;">
                                
                                <!-- 更新时间 -->
                                <div style='float: left; margin-top: 2px; height: 20px; width: 200px; font-size: 12px;base-font-size: 12px;color: #b2b2b2;'>
                                    <%= get_world_date().."  v"..(Eval("revision") or 0) %>
                                </div>
                            </div>

                            <div style="width: 160px; height: 32px; margin-top: -14px; margin-left: 103px;">
                                <input type='button' name='<%= Eval("index") %>' onmouseenter="OnMouseMoreEnter" onmouseleave="OnMouseMoreLeave"  onclick='OnclickShowExtra' value="" tooltip="<%=L'其他'%>" uiname='<%="CreateEmbed.more" .. Eval("index")%>' style='float: left;  margin-left: 128px; width: 20px;height: 20px;background: url(Texture/Aries/Creator/keepwork/community_32bits.png#266 100 20 20);'/>
                            </div>
                        </div>
                        <pe:if condition='<%= is_load_more_items(Eval("index")) %>'>
                            <pe:custom oncreate='<%= lazy_load %>'></pe:custom>
                        </pe:if>
                    </div>
                </Columns>
                <EmptyDataTemplate>
                    <div style='font-weight: bold;'>
                        <div align='center'style='width: 160px;height: 128px; margin-top: 160px; background: url(Texture/Aries/Creator/keepwork/community_32bits.png#2 2 160 128)'>
                        </div>
                        <div style="text-align: center; font-size: 14px; base-font-size: 14px; margin-top: -10px; color: #A8A7B0;" ><%=L"你还没有创建3D世界"%></div>
                    </div>
                </EmptyDataTemplate>
            </pe:gridview>

        </div>
    </pe:container>
</pe:container>
</pe:mcml>
</body>
</html>
