<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<body>
<pe:mcml>
<script refresh="true" type="text/npl" src="EducateProject.lua" ><![CDATA[
    local EducateProject = NPL.load("(gl)script/apps/Aries/Creator/Game/Educate/Project/EducateProject.lua")
    EducateProject.OnInit()

    function GetMemeoryStr()
        return "剩余存档空间：".."10 MB"
    end

    function OnclickCreate()
        GameLogic.GetFilters():apply_filters("click_create_new_world")
    end

    function OnClickImprot()
        GameLogic.RunCommand("/menu file.importp3dfile")
    end

    function OnClickMenu()
        --print("ddddddddddddddd")
        EducateProject.ShowOptionMenu()
    end

    function onSearch()
        EducateProject.OnClickSearch()
    end

    function OnCloseSearch()
        EducateProject.ClearSearch()
    end

    function onSearchInputKeyup(name,mcmlNode)
        if(virtual_key == Event_Mapping.EM_KEY_RETURN or virtual_key == Event_Mapping.EM_KEY_NUMPADENTER) then
            onSearch()
        end
    end
]]></script>
<!-- <pe:container alignment="_fi" width="100%" height="100%" style="background-color:#dcdcdc"> </pe:container> -->
<pe:container style="width:1132px;height:600px;background:url();">       
    <!-- RIGHT -->
    <div style="float:left;width:1132px;height:600px;background:url();">
        <div style="position: relative; width: 320px; height: 112px; background: url();"></div>
        <!-- 上面的是通用的 -->
        <div style="width: 1060px; height: 90px; margin-top: 20px; margin-left: 30px; ">
            <div style="position: relative;font-size: 20px; base-font-size: 20px;font-weight: bold;"><%=L"我的作品"%></div>
            <pe:container alignment="_rt" uiname="project_search" style="position: relative; width: 216px; height: 32px; margin-right: 200px; background: url();">
                <div style=' width: 216px; height: 32px; margin-top: 0px; background: url(Texture/Aries/Creator/paracraft/Educate/Project/search_bg_32bits.png#0 0 32 32:14 14 14 14);'>
                    <input type='button' 
                            onclick='onSearch'
                            style='position: relative; width: 14px; height: 14px;
                                    margin-top: 8px;
                                    margin-left: 10px;
                                    background: url(Texture/Aries/Creator/paracraft/Educate/Project/sousuo_14x14_32bits.png#0 0 14 14)'/>
                    <input type='text' 
                            name='project_search_content' 
                            EmptyText='<%= L"输入关键词搜索我的作品" %>' 
                            EmptyTextColor='#FFB9BABC' 
                            textcolor='#B9BABCFF'
                            onkeyup='onSearchInputKeyup'
                            style='position: relative; margin-left: 36px; margin-top: 2px; width: 210px; height: 26px; font-size: 12px; base-font-size: 12px; text-valign: center; background:;'/>
                    
                    <input type="button" onclick="OnCloseSearch" style=" margin-top: -24px; margin-left: 196px;width:16px;height:16px;background:url(Texture/Aries/Creator/paracraft/Educate/Project/search_cancel_32bits.png#0 0 16 16)" />
                </div>
            </pe:container>
            <pe:if condition="<%=Mod.WorldShare.Utils.IsEnglish()%>">
                <pe:container alignment="_rt" uiname="option_menu_pos_english"  style="position: relative; width: 120px; height: 30px; margin-right: 60px; background: url();">
                    <input type="button" value="<%=L'导入存档'%>" onclick="OnClickMenu" icon="Texture/Aries/Creator/paracraft/Educate/Project/import_16x16_32bits.png;0 0 16 16" icon_off_x="-52" icon_off_y="0" icon_width="16" icon_height="16" style= "color: #0693FE; width: 120px; height: 30px; background: url(Texture/Aries/Creator/paracraft/Educate/Project/importBg_32x32_32bits.png#0 0 32 32:14 14 14 14); text-offset-x:10;"/>
                </pe:container>
            </pe:if>
            <pe:if condition="<%=not Mod.WorldShare.Utils.IsEnglish()%>">
                <pe:container alignment="_rt" uiname="option_menu_pos"  style="position: relative; width: 100px; height: 30px; margin-right: 80px; background: url();">
                    <input type="button" value="<%=L'导入存档'%>" onclick="OnClickMenu" icon="Texture/Aries/Creator/paracraft/Educate/Project/import_16x16_32bits.png;0 0 16 16" icon_off_x="-30" icon_off_y="0" icon_width="16" icon_height="16" style= "color: #0693FE; width: 100px; height: 30px; background: url(Texture/Aries/Creator/paracraft/Educate/Project/importBg_32x32_32bits.png#0 0 32 32:14 14 14 14); text-offset-x:10;"/>
                </pe:container>
            </pe:if>
        </div>
        <!-- 占位 -->
        <div style="margin-top: 6px; margin-left: 10px;  width: 1080px; height: 400px; ">
            
        </div>
        <!-- 剩余空间 和 新建作品 -->
        <div style="margin-top: 10px; margin-left: 20px;">
            <input type="text" uiname="project_memui" name="project_mem" ReadOnly="true" value="<%=GetMemeoryStr()%>" style="margin-left: 762px; margin-top: 20px; color: #6879B7; font-size: 12px; background: url();" />
            <pe:if condition="<%=Mod.WorldShare.Utils.IsEnglish()%>">
                <input onclick="OnclickCreate" type="button" value='<%=L"新建作品"%>' style="margin-left: 900px; margin-top: -40px; font-size: 20px; base-font-size: 20px; color: #ffffff; font-weight: bold; width: 160px; height: 60px; background: url(Texture/Aries/Creator/paracraft/Educate/daquedin_46x46_32bits.png#0 0 46 46:22 22 22 22);"/>
            </pe:if>
            <pe:if condition="<%=not Mod.WorldShare.Utils.IsEnglish()%>">
                <input onclick="OnclickCreate" type="button" value='<%=L"新建作品"%>' icon="Texture/Aries/Creator/paracraft/Educate/Project/jiahao_20x20_32bits.png;0 0 20 20" icon_off_x="-46" icon_width="20" icon_height="20" style="margin-left: 900px; margin-top: -40px; font-size: 20px; base-font-size: 20px; color: #ffffff; font-weight: bold; text-offset-x:20;width: 160px; height: 60px; background: url(Texture/Aries/Creator/paracraft/Educate/daquedin_46x46_32bits.png#0 0 46 46:22 22 22 22);"/>
            </pe:if>
        </div>
    </div>
</pe:container>
</pe:mcml>
</body>
</html>
