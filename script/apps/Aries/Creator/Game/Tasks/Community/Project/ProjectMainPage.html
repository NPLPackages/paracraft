<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<body>
<pe:mcml>
<script refresh="true" type="text/npl" src="ProjectMainPage.lua" ><![CDATA[
    NPL.load('(gl)script/apps/Aries/Creator/Game/Common/Translation.lua')
    local Translation = commonlib.gettable('MyCompany.Aries.Game.Common.Translation')
    local curLanguage = Translation.GetCurrentLanguage()
    local ProjectMainPage = NPL.load("(gl)script/apps/Aries/Creator/Game/Tasks/Community/Project/ProjectMainPage.lua")
    ProjectMainPage.OnInit()

    function OnclickCreate()
        GameLogic.GetFilters():apply_filters("click_create_new_world")
    end

    function GetMenuData()
        return ProjectMainPage.GetMenuData()
    end

    function GetCategoryDSIndex()
        return ProjectMainPage.GetCategoryDSIndex()
    end

    function OnChangeTabview(index)
        ProjectMainPage.ChangeMenuTab(index)
    end

    function IsSearching()
        return true
    end

    function onSearch()
        ProjectMainPage.OnClickSearch()
    end

    function OnChangeSearch()
        ProjectMainPage.ChangeSearch()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_main.click_show_search", {useNoId=true},nil,true);
    end

    function OnCloseSearch()
        --ProjectMainPage.CloseSearch()
        ProjectMainPage.ClearSearch()
        GameLogic.GetFilters():apply_filters("user_behavior", 1, "click.community.project_main.click_hide_search", {useNoId=true},nil,true);
    end

    function onSearchInputFocusOut()
        ProjectMainPage.OnSearchInputFocusOut()
    end

    function GetIframeUrl()
        return ProjectMainPage.GetIframeUrl()
    end

    function IsCanSearch()
        return ProjectMainPage.select_tab == 1 or ProjectMainPage.select_tab == 2
    end

    function GetButtonHtml(index)
        if index then
            if index == GetCategoryDSIndex() then
                return [[<input type="button" value='<%=Eval("value")%>' name='<%=Eval("index")%>' onclick="OnChangeTabview" style="float: left; font-weight:bold;margin-left: 8px; margin-top: 0px; color:#d3d3d3;font-size:14px;height:60px;background:url()" />]]
            else
                return [[<input type="button" value='<%=Eval("value")%>' name='<%=Eval("index")%>' onclick="OnChangeTabview" style="float: left; font-weight:bold; margin-top: 0px; margin-left: 8px;color:#A8A7B0;font-size:14px;height:60px;background:url()" />]]
            end
        end
        return [[<input type="button" value='<%=Eval("value")%>' name='<%=Eval("index")%>' onclick="OnChangeTabview" style="float: left; font-weight:bold; margin-top: 0px; margin-left: 8px;color:#A8A7B0;font-size:14px;height:60px;background:url()" />]]
    end

    local selectConfig = {
        ["enUS"] = {50,180,326,450},
        ["zhCN"] = {46,140,232,323},
        ["zhTW"] = {46,140,232,323}
    }
    function GetSelectStyle()
        local htmlStr = [[<div style="position: relative; margin-left:%dpx;  margin-top: 56px; width: 22px; height: 4px; background-color: #404BF5;"></div>]]
        local htmlConfig = selectConfig[curLanguage]
        local left = htmlConfig and htmlConfig[ProjectMainPage.select_tab]
        if not left then
            left = 50
        end
        return string.format(htmlStr, left)
    end

    function onSearchInputKeyup(name,mcmlNode)
        if(virtual_key == Event_Mapping.EM_KEY_RETURN or virtual_key == Event_Mapping.EM_KEY_NUMPADENTER) then
            onSearch()
        end
    end
]]></script>
<pe:container style="width:1140px;height:660px;background:url();">       
    <div style="float:left;width:1140px;height:660px; background-color: #1a1a1a;">
        <div zorder="1" style="width: 1140px; height: 60px; ">
            <div style="float: left; width: 520px; height: 60px;">
                <pe:repeat DataSource="<%=GetMenuData()%>" >
                    <pe:repeatitem>
                        <pe:if condition='<%=GetCategoryDSIndex() == Eval("index") %>' >
                            <input type="button" value='<%=Eval("value")%>' name='<%=Eval("index")%>' onclick="OnChangeTabview" style="float: left; font-weight:bold;margin-left: 24px; margin-top: 0px; color:#ffffff;font-size:14px;height:60px;background:url()" />
                        </pe:if>
                        <pe:if condition='<%=GetCategoryDSIndex() ~= Eval("index") %>' >
                            <input type="button" value='<%=Eval("value")%>' name='<%=Eval("index")%>' onclick="OnChangeTabview" style="float: left; font-weight:bold; margin-top: 0px; margin-left: 24px;color:#A8A7B0;font-size:14px;height:60px;background:url()" />
                        </pe:if>
                    </pe:repeatitem>
                </pe:repeat>
                <!-- 选中效果 -->
                <div style="position: relative; width: 540px; height: 60px; margin-top: -60px;">
                    <%=GetSelectStyle()%>
                </div>
            </div>
            
            <div style="float: left; width: 620px; height: 60px; background-color: #00550009;">
                <pe:container ClickThrough="true" visible='<%=IsCanSearch()%>' uiname="search_container" style="position: relative; width: 620px; height: 50px; background: url();">
                    <div align="right" style='margin-right: 20px; width: 300px; height: 40px; margin-top: 8px; background-color: #252525;'>
                        <input type='text' 
                                name='search_content' 
                                spacing='10'
                                EmptyText='<%= L"输入关键词搜索我的作品" %>' 
                                EmptyTextColor='#FFFFFFFF' 
                                textcolor='#FFFFFFFF'
                                onkeyup='onSearchInputKeyup'
                                style='width: 236px; height: 40px; font-size: 12px; base-font-size: 12px; text-valign: center; background:;'/>
                        <input type='button' 
                                DefaultButton='true'
                                name='search_button'
                                onclick='onSearch'
                                value='<%= L"搜索" %>'
                                style='position: relative; width: 50px; height: 32px;text-offset-y: -3px; font-weight: bold;font-size: 14px; base-font-size: 14px;
                                        margin-top: 4px;
                                        margin-left: 10px;
                                        color: #d3d3d3FF;background-color: #333333; 
                                        background: url(Texture/Aries/Creator/keepwork/community_32bits.png#778 146 32 32:14 14 14 14)'/>
                        <input type="button" onclick="OnCloseSearch" style=" margin-top: -30px; margin-left: 224px;width:16px;height:16px;background:url(Texture/Aries/Creator/keepwork/community_32bits.png#816 146 18 18)" />
                    </div>
                </pe:container>
                <!-- <pe:if condition="<%=IsCanSearch()%>">
                    <pe:container ClickThrough="true"  visible='true' uiname="no_search_container" style="position: relative; width: 620px; height: 50px; background: url();">
                        <pe:if condition='<%= not Mod.WorldShare.Utils.IsEnglish() %>'>
                            <input align="right" type="button" value='<%= L"搜索" %>' onclick="OnChangeSearch"  icon="Texture/Aries/Creator/keepwork/community_32bits.png;506 238 16 16" icon_width="16" icon_height="16" icon_off_x="-26"  style=" margin-top: 9px; margin-right: 10px;color:#d3d3d3;font-size:14px; base-font-size:14px; font-weight: bold; width:50px;height:46px;background:url()" />
                        </pe:if>
                        <pe:if condition='<%= Mod.WorldShare.Utils.IsEnglish() %>'>
                            <input align="right" type="button" value='<%= L"搜索" %>' onclick="OnChangeSearch"  icon="Texture/Aries/Creator/keepwork/community_32bits.png;506 238 16 16" icon_width="16" icon_height="16" icon_off_x="-26"  style=" margin-top: 8px; text-offset-x:6; margin-right: 20px;color:#d3d3d3;font-size:14px; base-font-size:14px; font-weight: bold; width:50px;height:46px;background:url()" />
                        </pe:if>
                    </pe:container>
                </pe:if> -->
                
            </div>
        </div>
        
        <div style=" width: 2560px; height: 1px; margin-top: -1px; margin-left: -640px; background-color: #313131ff"></div>
        <!-- 占位 -->
        <div style="margin-top: 0px;  width: 1140px; height: 600px; ">
            <iframe name="community_project_frame" src="<%=GetIframeUrl()%>"></iframe>
        </div>
        
    </div>
</pe:container>
</pe:mcml>
</body>
</html>
